services:
  codex:
    image: codex-local
    build:
      context: .
      args:
        CODEX_UID: "${CODEX_UID:-1000}"
        CODEX_GID: "${CODEX_GID:-1000}"
        HTTP_PROXY: "${HTTP_PROXY-${http_proxy:-}}"
        http_proxy: "${http_proxy-${HTTP_PROXY:-}}"
        HTTPS_PROXY: "${HTTPS_PROXY-${https_proxy:-}}"
        https_proxy: "${https_proxy-${HTTPS_PROXY:-}}"
        NO_PROXY: "${NO_PROXY-${no_proxy:-}}"
        no_proxy: "${no_proxy-${NO_PROXY:-}}"
        ALL_PROXY: "${ALL_PROXY-${all_proxy:-}}"
        all_proxy: "${all_proxy-${ALL_PROXY:-}}"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: "/home/workspace/${CODEX_PROJECT_NAME:-project}"
    volumes:
      - type: bind
        source: "${CODEX_PROJECTS_DIR:-.}/${CODEX_PROJECT_NAME:-project}"
        target: "/home/workspace/${CODEX_PROJECT_NAME:-project}"
        bind:
          create_host_path: false
      - codex_data:/home/workspace/.codex

volumes:
  codex_data:
    name: codex_data
