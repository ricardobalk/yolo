name: Build container image
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.check.name }} (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        check:
          - name: Build and run
            script: build-image.sh
          - name: Check airplane mode
            script: check-airplane-mode.sh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: ./code/containers/codex/ci/${{ matrix.check.script }} "${{ matrix.engine }}"
